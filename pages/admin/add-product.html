<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Admin Panel</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/checkout.css">
    <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

    <div class="admin-layout">
        <!-- Admin Sidebar Navigation -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <i class="fas fa-shield-alt"></i>
                <span>ShopCraft Admin</span>
            </div>
            <ul class="admin-menu">
                <li class="admin-menu-item"><a href="dashboard.html"><i class="fas fa-chart-line"></i> <span>Dashboard</span></a></li>
                <li class="admin-menu-item"><a href="add-product.html" class="active"><i class="fas fa-plus-circle"></i> <span>Add Product</span></a></li>
                <li class="admin-menu-item"><a href="products.html"><i class="fas fa-tags"></i> <span>Products</span></a></li>
                <li class="admin-menu-item"><a href="orders.html"><i class="fas fa-shopping-bag"></i> <span>Orders</span></a></li>
                <li class="admin-menu-item"><a href="customers.html"><i class="fas fa-users"></i> <span>Customers</span></a></li>
            </ul>
            <div class="admin-logout-btn">
                <button onclick="handleAdminLogout()" class="btn btn-danger btn-block btn-sm">
                    <i class="fas fa-sign-out-alt"></i> <span>Logout Admin</span>
                </button>
            </div>
        </aside>

        <!-- Admin Main Content Area -->
        <main class="admin-content">
            <div class="admin-header">
                <div>
                    <h1>Add New Product</h1>
                    <p style="color:var(--text-secondary);">Create a new inventory item for the storefront catalog</p>
                </div>
            </div>

            <div class="checkout-section" style="max-width: 750px;">
                <form onsubmit="handleAddProduct(event)">
                    <div class="form-group">
                        <label for="prod-name" class="form-label">Product Title / Name *</label>
                        <input type="text" id="prod-name" class="form-control form-control-simple" placeholder="e.g., Ergonomic Gaming Keyboard" required>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="prod-category" class="form-label">Category *</label>
                            <select id="prod-category" class="form-control form-control-simple" required>
                                <option value="Electronics">Electronics</option>
                                <option value="Fashion">Fashion</option>
                                <option value="Shoes">Shoes</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Home">Home</option>
                                <option value="Beauty">Beauty</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="prod-price" class="form-label">Price ($) *</label>
                            <input type="number" id="prod-price" class="form-control form-control-simple" step="0.01" min="0.01" placeholder="99.99" required>
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="prod-stock" class="form-label">Stock Quantity *</label>
                            <input type="number" id="prod-stock" class="form-control form-control-simple" min="0" placeholder="25" required>
                        </div>

                        <div class="form-group">
                            <label for="prod-rating" class="form-label">Rating (1.0 - 5.0)</label>
                            <input type="number" id="prod-rating" class="form-control form-control-simple" step="0.1" min="1" max="5" value="4.5" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="prod-image" class="form-label">Image URL *</label>
                        <input type="url" id="prod-image" class="form-control form-control-simple" placeholder="https://images.unsplash.com/..." required>
                    </div>

                    <div class="form-group">
                        <label for="prod-description" class="form-label">Product Description *</label>
                        <textarea id="prod-description" class="form-control form-control-simple" rows="4" placeholder="Detailed product specifications..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="padding:0.9rem 2rem;">
                        <i class="fas fa-save"></i> Save Product to Catalog
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../../js/storage.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/admin.js"></script>
</body>
</html>
