<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - ShopCraft</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body style="background:#0f172a;">

    <main class="auth-wrapper">
        <div class="auth-card" style="border-top: 4px solid var(--secondary);">
            <div class="auth-header">
                <i class="fas fa-user-shield brand-icon" style="color:var(--secondary);"></i>
                <h2>Admin Control Panel</h2>
                <p>Sign in with administrator credentials</p>
                <div style="background:var(--bg-alt); padding:0.6rem; border-radius:8px; margin-top:0.75rem; font-size:0.85rem; border:1px dashed var(--border-color);">
                    <strong>Demo Admin:</strong> admin@shop.com | admin123
                </div>
            </div>

            <form onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label for="admin-email" class="form-label">Admin Email</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="admin-email" class="form-control" value="admin@shop.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="admin-password" class="form-label">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="admin-password" class="form-control" value="admin123" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem; background:linear-gradient(135deg, var(--secondary), #0891b2);">
                    <i class="fas fa-shield-alt"></i> Login to Admin Panel
                </button>
            </form>

            <div class="auth-footer">
                <a href="../../index.html"><i class="fas fa-arrow-left"></i> Back to Main Storefront</a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../../js/storage.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/admin.js"></script>
</body>
</html>
