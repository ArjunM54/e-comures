<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Delivery Information - ShopCraft</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fas fa-shopping-bag"></i>
                <span>ShopCraft</span>
            </a>

            <button class="menu-toggle-btn" id="menu-toggle" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>

            <ul class="nav-links" id="nav-links">
                <li><a href="../index.html" class="nav-link"><i class="fas fa-home"></i> Store</a></li>
                <li><a href="cart.html" class="nav-link"><i class="fas fa-shopping-cart"></i> Cart</a></li>
            </ul>

            <div class="user-nav-actions" id="user-nav-actions">
                <!-- Dynamically updated by main.js -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="page-title-section">
            <h1><i class="fas fa-truck" style="color:var(--primary);"></i> Shipping & Delivery Details</h1>
            <p>Enter your contact and address details to process order shipment</p>
        </div>

        <div class="checkout-grid">
            <!-- Delivery Details Form -->
            <div class="checkout-section">
                <h3 class="checkout-section-title"><i class="fas fa-map-marker-alt"></i> Shipping Address</h3>
                
                <form id="checkout-form" onsubmit="handleCheckoutSubmit(event)">
                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="checkout-name" class="form-label">Full Name *</label>
                            <input type="text" id="checkout-name" class="form-control form-control-simple" placeholder="Jane Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="checkout-email" class="form-label">Email Address *</label>
                            <input type="email" id="checkout-email" class="form-control form-control-simple" placeholder="jane@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="checkout-phone" class="form-label">Phone Number *</label>
                        <input type="tel" id="checkout-phone" class="form-control form-control-simple" placeholder="1234567890" required>
                    </div>

                    <div class="form-group">
                        <label for="checkout-address" class="form-label">Street Address *</label>
                        <input type="text" id="checkout-address" class="form-control form-control-simple" placeholder="Flat / House No., Street, Area" required>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="checkout-city" class="form-label">City *</label>
                            <input type="text" id="checkout-city" class="form-control form-control-simple" placeholder="New York" required>
                        </div>
                        <div class="form-group">
                            <label for="checkout-state" class="form-label">State *</label>
                            <input type="text" id="checkout-state" class="form-control form-control-simple" placeholder="NY" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="checkout-pincode" class="form-label">Pincode / ZIP *</label>
                        <input type="text" id="checkout-pincode" class="form-control form-control-simple" placeholder="10001" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
                        Proceed to Payment <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
            </div>

            <!-- Summary Breakdown -->
            <div class="cart-summary-card" id="checkout-summary">
                <!-- Rendered dynamically by checkout.js -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-bottom">
            <p>&copy; 2026 ShopCraft E-Commerce Project. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/checkout.js"></script>
</body>
</html>
