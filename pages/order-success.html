<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed Successfully - ShopCraft</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <i class="fas fa-shopping-bag"></i>
                <span>ShopCraft</span>
            </a>

            <button class="menu-toggle-btn" id="menu-toggle" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>

            <ul class="nav-links" id="nav-links">
                <li><a href="../index.html" class="nav-link"><i class="fas fa-home"></i> Store</a></li>
                <li><a href="my-orders.html" class="nav-link"><i class="fas fa-box"></i> My Orders</a></li>
            </ul>

            <div class="user-nav-actions" id="user-nav-actions">
                <!-- Dynamically updated by main.js -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="success-container">
            <div class="success-icon-wrap">
                <i class="fas fa-check"></i>
            </div>
            <h1 class="success-title">Order Placed Successfully!</h1>
            <p class="success-subtitle">Thank you for your purchase! Your order has been placed and is currently being prepared.</p>

            <div class="order-receipt-box" id="order-receipt-content">
                <!-- Order details rendered dynamically by js/orders.js -->
            </div>

            <div style="display:flex; gap:1rem; justify-content:center;">
                <a href="my-orders.html" class="btn btn-primary">
                    <i class="fas fa-box"></i> View My Orders
                </a>
                <a href="../index.html" class="btn btn-secondary">
                    <i class="fas fa-shopping-cart"></i> Continue Shopping
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-bottom">
            <p>&copy; 2026 ShopCraft E-Commerce Project. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/orders.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initOrderSuccessPage();
        });
    </script>
</body>
</html>
